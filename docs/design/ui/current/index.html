<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fish Social · 现行预览</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      background: #efe6d6;
      color: #5c4332;
      font: 15px/1.45 "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    nav {
      width: 232px;
      flex: none;
      padding: 18px 14px 24px;
      background: #fff8ee;
      border-right: 1px solid #eadcc6;
      overflow: auto;
    }
    h1 { margin: 0 0 4px; font-size: 18px; font-weight: 650; }
    .note { margin: 0 0 16px; font-size: 12px; color: #8a705c; }
    h2 { margin: 16px 0 6px; font-size: 12px; font-weight: 650; letter-spacing: .04em; color: #a1846c; }
    button {
      display: block;
      width: 100%;
      margin: 0 0 4px;
      padding: 8px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    button[aria-current="true"] { background: #fc923c; color: white; }
    button:focus-visible { outline: 3px solid #c47a32; outline-offset: 1px; }
    main { flex: 1; min-width: 0; display: flex; }
    iframe { width: 100%; height: 100%; border: 0; background: #d7e2d4; }
  </style>
</head>
<body>
  <nav>
    <h1>现行预览</h1>
    <p class="note">界面、形象、动作、地图、特效和音效都在这一页。点左侧切换。演示数据，声音需要再点播放。</p>
    <h2>手账</h2>
    <button type="button" data-src="../prototype/cozy-journal/index.html?page=shop" aria-current="true">商店</button>
    <button type="button" data-src="../prototype/cozy-journal/index.html?page=bag">背包</button>
    <button type="button" data-src="../prototype/cozy-journal/index.html?page=equip">装备</button>
    <button type="button" data-src="../prototype/cozy-journal/index.html?page=ach">成就</button>
    <button type="button" data-src="../prototype/cozy-journal/index.html?page=rank">排行榜</button>
    <button type="button" data-src="../prototype/cozy-journal/index.html?page=profile">个人信息</button>
    <button type="button" data-src="../prototype/cozy-journal/index.html?page=feed">钓友动态</button>
    <button type="button" data-src="../prototype/cozy-journal/index.html?page=settings">设置</button>
    <h2>家园与地图</h2>
    <button type="button" data-src="../prototype/cozy-journal/index.html?roomView=home">家园</button>
    <button type="button" data-src="../prototype/cozy-journal/index.html?page=map">世界地图</button>
    <button type="button" data-src="../prototype/cozy-journal/index.html?page=ponds">选择鱼塘</button>
    <h2>资料与收获</h2>
    <button type="button" data-src="../prototype/journal-workspace/index.html#profile">个人资料</button>
    <button type="button" data-src="../prototype/journal-workspace/index.html#edit">编辑资料</button>
    <button type="button" data-src="../prototype/journal-workspace/index.html#compose">分享鱼获</button>
    <button type="button" data-src="../prototype/journal-workspace/index.html#settlement">离塘结算</button>
    <h2>钓友来信</h2>
    <button type="button" data-src="../prototype/social-refinement/index.html#friends">我的钓友</button>
    <button type="button" data-src="../prototype/social-refinement/index.html#requests">好友申请</button>
    <button type="button" data-src="../prototype/social-refinement/index.html#dm">私信</button>
    <button type="button" data-src="../prototype/social-refinement/index.html#pond">鱼塘聊天</button>
    <button type="button" data-src="../prototype/social-refinement/index.html#notifications">消息通知</button>
    <h2>登录</h2>
    <button type="button" data-src="../../../art/login-pastel-2026-10-26/cats-v4/index.html">五猫完整窗口</button>
    <h2>形象</h2>
    <button type="button" data-src="../../../art/cat-skins/breeds.html">九种钓鱼猫咪</button>
    <button type="button" data-src="../../../art/cat-skins/sangbiao/index.html">狸花猫丧彪</button>
    <button type="button" data-src="../../../art/cat-skins/character-study-2026-10-24/index.html">六款形象稿</button>
    <h2>动作</h2>
    <button type="button" data-src="../../../art/fishing-motion/index.html">塘内钓鱼动作</button>
    <button type="button" data-src="../prototype/cozy-journal/home-animation-review.html">家园走路进食</button>
    <h2>特效</h2>
    <button type="button" data-src="../../../art/water-effects-22h/index.html?style=magic">水面特效</button>
    <h2>音效</h2>
    <button type="button" data-src="../../../art/audio-22i/v5/index.html">配乐与音效</button>
  </nav>
  <main>
    <iframe id="stage" title="现行预览" src="../prototype/cozy-journal/index.html?page=shop"></iframe>
  </main>
  <script>
    const stage = document.querySelector('#stage');
    document.querySelectorAll('button[data-src]').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('button[data-src]').forEach(item => {
          if (item === button) item.setAttribute('aria-current', 'true');
          else item.removeAttribute('aria-current');
        });
        stage.src = button.dataset.src;
      });
    });
  </script>
</body>
</html>
