</style><div id="stage"><header class="top"><div class="brand"><img src="../../../../../fish-social-unity/Assets/Resources/Desktop/Theme/Cozy/characters/avatars/orange.png"><span>湖边手账</span></div><div style="display:flex;gap:20px"><div class="pill">金币　12,850</div><button class="pill mail" onclick="openPage('notifications')">来信<span class="badge" id="badge">3</span></button></div></header><main class="book"><div class="pagehead"><img src="../../../../../fish-social-unity/Assets/Resources/Desktop/Theme/Cozy/icons/social.png"><div><h1>钓友来信</h1><p>好友、申请、私信与鱼塘聊天，各有自己的位置</p></div><button class="close" aria-label="关闭">×</button></div><aside class="rail" id="rail"></aside><div class="head"><h2 id="title"></h2><p id="hint"></p><button class="btn refresh" onclick="status('已刷新，所有消息都是最新的')">↻ 刷新</button></div><section id="body" class="body"></section><div class="status" id="status"></div></main><nav class="foot"><span>背包</span><span>装备</span><span>钓友来信</span><span>商店</span><span>我的手账</span></nav></div><div class="preview">交互设计预览 · 演示数据，不发送真实申请或消息 · 正式实现使用 Unity 原生 UI</div><script>
const U='../../../../../fish-social-unity/Assets/Resources/Desktop/Theme/Cozy/icons/';
const sections=[['friends','我的钓友','user','从钓友名片发起私聊；Steam 邀请只用于一起进塘。'],['requests','好友申请','heart','收到的申请需要明确接受或忽略；不会自动打开聊天。'],['dm','私信','social','只与你选择的钓友对话，消息不会发送到鱼塘。'],['pond','鱼塘聊天','fish','当前鱼塘的公共聊天；离塘后仍可查看好友与私信。'],['notifications','消息通知','bell','通知只提醒发生了什么，打开后再决定如何处理。']];
let section='requests',request=true,unread=3,recipient='阿花',sent=[];
const $=s=>document.querySelector(s),safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(s){$('#status').textContent=s}
function friend(name,sub,actions){return `<article class="row friend"><h3>${name}</h3><p>${sub}</p><div class="actions">${actions}</div></article>`}
function dm(name){recipient=name;openPage('dm')}
function accept(){request=false;render();status('已接受好友申请，可在「我的钓友」发起私聊。')}
function ignore(){request=false;render();status('已忽略这条申请。')}
function notice(target){unread=Math.max(0,unread-1);openPage(target)}
function readall(){unread=0;render();status('所有通知已标记为已读，好友申请仍需单独处理。')}
function openPage(id){section=id;render();$('#body').classList.remove('fade');void $('#body').offsetWidth;$('#body').classList.add('fade')}
function render(){
$('#rail').innerHTML=sections.map(([id,title,icon])=>`<button class="tab ${section===id?'sel':''}" onclick="openPage('${id}')"><img src="${U+icon}.png">${title}${id==='requests'&&request?'<small>1</small>':''}${id==='notifications'&&unread?'<small>'+unread+'</small>':''}</button>`).join('');const current=sections.find(x=>x[0]===section);$('#title').textContent=current[1];$('#hint').textContent=current[3];$('#badge').textContent=unread;$('#badge').hidden=!unread;
if(section==='requests'){$('#body').innerHTML=`<div class="list"><div class="group">收到的申请</div>${request?`<article class="row request"><i class="tape"></i><h3>芦苇边的猫</h3><p>10-22 09:30 · 想和你成为好友<br>接受后可互发私信，一起约钓。</p><div class="actions"><button class="btn primary" onclick="accept()">接受</button><button class="btn" onclick="ignore()">忽略</button></div></article>`:'<article class="row"><p>没有待处理申请。新的钓友来信会显示在这里。</p></article>'}<div class="group" style="margin-top:24px">我发出的申请</div><article class="row"><h3>湖边钓手</h3><p>等待对方回应 · 10-21 18:20</p></article></div>`;status(`收到 ${request?1:0} 条申请 · 已发出 1 条`)}
if(section==='friends'){$('#body').innerHTML=`<div class="split"><div class="list" style="width:710px">${friend('阿花','成为好友 · 10-20 16:25','<button class="btn" onclick="dm(\'阿花\')">发私信</button><button class="btn" onclick="status(\'请再次确认是否移除好友\')">移除好友</button>')}${friend('小白','成为好友 · 10-19 10:10','<button class="btn" onclick="dm(\'小白\')">发私信</button><button class="btn">移除好友</button>')}<div class="group">Steam 好友 · 邀请进塘</div>${friend('池塘边的云','在线 · Steam 好友','<button class="btn" onclick="status(\'演示：通过 Steam 邀请进塘\')">邀请进塘</button>')}</div><aside class="guide"><h3>认识新的钓友</h3><img src="../../../../../fish-social-unity/Assets/Resources/Desktop/Theme/Cozy/characters/avatars/orange.png"><p>好友申请在「好友申请」处理。<br>私信只发给选中的好友。<br>邀请进塘会通过 Steam 发送。</p></aside></div>`;status('已有 2 位钓友')}
if(section==='dm'){$('#body').innerHTML=`<div class="split"><div class="list people">${friend('阿花','明天一起去千岛湖吗？','<button class="btn" onclick="dm(\'阿花\')">打开 · 2 未读</button>')}${friend('小白','今天湖边风很舒服','<button class="btn" onclick="dm(\'小白\')">打开会话</button>')}</div><div class="conversation"><h3>与 ${recipient} 的私聊</h3><div class="messages"><div class="message"><small>${recipient} · 10-22 10:26</small><p>今天在芦苇边钓到一条很漂亮的鲤鱼！</p></div><div class="message"><small>${recipient} · 10-22 10:27</small><p>明天一起去千岛湖吗？</p></div>${sent.map(s=>'<div class="message mine"><small>我 · 刚刚</small><p>'+safe(s)+'</p></div>').join('')}</div><form class="send" onsubmit="event.preventDefault();send()"><textarea id="draft" maxlength="300" placeholder="给钓友留句话…" aria-label="私信内容"></textarea><button class="btn primary">发送</button></form></div></div>`;status(`私信仅对你和 ${recipient} 可见 · 最多 300 字`)}
if(section==='pond'){$('#body').innerHTML=`<div class="split"><div class="list people"><div class="group">同塘钓友 · 千岛湖</div>${friend('阿花','正在等鱼上钩','')}${friend('小白','刚刚收获一条鲤鱼','')}</div><div class="conversation"><h3>鱼塘公共聊天</h3><div class="messages"><div class="message"><small>鱼塘公告 · 10-22 10:20</small><p>欢迎来到千岛湖，愿你今天满载而归。</p></div><div class="message"><small>阿花 · 10-22 10:27</small><p>东边芦苇附近有鱼群，大家可以来看看。</p></div></div><div class="send"><textarea placeholder="发送到当前鱼塘（200 字）" maxlength="200"></textarea><button class="btn primary" onclick="status('演示：塘内消息与私信使用不同接口')">发送</button></div></div></div>`;status('鱼塘公共聊天 · 最多 200 字')}
if(section==='notifications'){$('#body').innerHTML=`<div class="readall"><button class="btn" onclick="readall()">全部标记已读</button></div><div class="list" style="height:364px"><article class="row request"><h3>${unread?'● ':''}新的好友申请</h3><p>芦苇边的猫 想和你成为好友</p><div class="actions"><button class="btn primary" onclick="notice('requests')">查看申请</button><button class="btn" onclick="status('通知已读，申请仍待处理')">标记已读</button></div></article><article class="row request"><h3>${unread?'● ':''}阿花发来私信</h3><p>明天一起去千岛湖吗？</p><div class="actions"><button class="btn primary" onclick="notice('dm')">查看私信</button><button class="btn" onclick="status('已标记为已读')">标记已读</button></div></article><article class="row request read"><h3>连接已恢复</h3><p>现在可以继续查看鱼塘消息。</p><div class="actions"><button class="btn" onclick="status('连接正常')">知道了</button></div></article></div>`;status('本次登录收到的通知 · '+unread+' 条未读')}
}
function send(){const value=$('#draft').value.trim();if(!value){status('请输入 1–300 字的私信。');return}sent.push(value);render();const list=$('.messages');list.scrollTop=list.scrollHeight}
function resize(){const s=Math.min(innerWidth/1672,innerHeight/941);$('#stage').style.transform=`scale(${s})`;document.body.style.height=941*s+'px'}addEventListener('resize',resize);resize();const hash=location.hash.slice(1);if(sections.some(x=>x[0]===hash))section=hash;render();
</script></html>
