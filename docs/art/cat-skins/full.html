<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>三花猫 · 全动作帧预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f1e7;color:#654831;font:16px/1.6 system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:28px}h1{margin:0 0 4px}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}button,select{font:inherit;color:inherit;border:1px solid #ceb59a;background:#fffcf6;border-radius:10px;padding:8px 14px}button[aria-pressed=true]{background:#724e35;color:#fff}.small{color:#806d5e;font-size:14px}.stage{display:grid;grid-template-columns:420px 1fr;gap:20px}.hero,figure{margin:0;background:#fffcf6;border:1px solid #decdb8;border-radius:15px;padding:14px}.hero img{display:block;width:100%;background-color:#ece9e0;background-image:linear-gradient(45deg,#e1dfd5 25%,transparent 25%,transparent 75%,#e1dfd5 75%),linear-gradient(45deg,#e1dfd5 25%,transparent 25%,transparent 75%,#e1dfd5 75%);background-size:24px 24px;background-position:0 0,12px 12px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.grid figure{padding:7px}.grid img{width:100%;display:block}.grid figcaption{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(max-width:900px){.stage{grid-template-columns:1fr}.grid{grid-template-columns:repeat(4,1fr)}}
</style>
<main><h1>三花猫 · 全动作帧预览</h1><p class="small">63 张源动作帧，鱼竿、鱼线、鱼、浮标和鱼饵沿用原版独立层；猫咪本体使用同画布原轮廓重绘。</p><div class="bar"><label>动作 <select id="clip"></select></label><button id="play" aria-pressed="false">播放当前动作</button><button id="all">查看全部帧</button><span id="status" class="small"></span></div><section class="stage"><figure class="hero"><img id="current" alt="当前三花猫动作帧"><figcaption id="caption"></figcaption></figure><section id="grid" class="grid"></section></section></main>
<script src="full-pose-data.js"></script><script>
const frames=window.poseStudy.frames;const clip=document.querySelector('#clip');const grid=document.querySelector('#grid');const current=document.querySelector('#current');const caption=document.querySelector('#caption');const status=document.querySelector('#status');let timer=0;let playing=false;let visible=frames;
const groups=[...new Set(frames.map(frame=>frame.clip))];for(const id of groups){const option=document.createElement('option');option.value=id;option.textContent=id;clip.append(option)}
function path(frame){return `calico-full/${frame.id}.png`}
function show(frame){current.src=path(frame);caption.textContent=`${frame.label} · ${frame.clip} ${frame.index+1} · ${frame.durationMs}ms`}
function render(){grid.textContent='';for(const frame of visible){const figure=document.createElement('figure');const image=document.createElement('img');image.src=path(frame);image.loading='lazy';image.alt=frame.label;const text=document.createElement('figcaption');text.textContent=`${frame.clip} ${frame.index+1}`;figure.append(image,text);figure.onclick=()=>show(frame);grid.append(figure)}status.textContent=`${visible.length} 帧 · ${groups.length} 个动作`}
function setClip(id){visible=frames.filter(frame=>frame.clip===id);render();show(visible[0])}
clip.onchange=()=>setClip(clip.value);document.querySelector('#all').onclick=()=>{visible=frames;render();show(frames[0])};document.querySelector('#play').onclick=event=>{playing=!playing;event.currentTarget.setAttribute('aria-pressed',String(playing));event.currentTarget.textContent=playing?'停止播放':'播放当前动作';if(!playing){clearInterval(timer);return}let index=0;const action=visible;clearInterval(timer);timer=setInterval(()=>{show(action[index++%action.length])},Math.max(80,action[0]?.durationMs||120))};setClip(groups[0]);
</script></html>
