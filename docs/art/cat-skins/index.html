<main>
<h1>猫咪换肤 · 原帧绘制对照</h1>
<p>橘猫原动作 → 三花猫完整姿势素材。头、身体、手臂不做拼装。</p>
<p class="note">首批四张关键姿势为待校准稿。尚未接入 Unity / Overlay，也不代表完整动画已完成。</p>
<nav id="poses" aria-label="关键姿势"></nav>
<div class="toolbar">
<label>查看方式 <select id="mode"><option value="art">完整角色素材</option><option value="ghost">叠加原版轮廓</option><option value="difference">轮廓差异：红色为新稿，青色为原版</option><option value="gear">原道具与原遮挡蒙版试配</option></select></label>
<button id="blink" aria-pressed="false">交替对照</button>
<span class="small">交替只比较同一姿势，不把四张关键姿势当连续动画。</span>
</div>
<div class="comparison">
<figure><figcaption id="left-label">原版橘猫</figcaption><canvas id="original" width="640" height="512"></canvas></figure>
<figure><figcaption id="right-label">三花猫 · 完整姿势重绘</figcaption><canvas id="candidate" width="640" height="512"></canvas></figure>
</div>
<div id="metrics" class="metrics"></div>
<p id="status"></p><p id="error" role="alert"></p>
<p class="small">新稿按整个画布缩放到 640 × 512 对照；没有单独缩放头、肢体或自动移动握点。道具试配沿用原帧蒙版，只有绘图精确对齐后才能复用；该视图不能代替逐帧遮挡验收。</p>
<details><summary>全部动作的绘制进度</summary><table><thead><tr><th>源动作 / 帧</th><th>运行时复用</th><th>状态</th></tr></thead><tbody id="coverage"></tbody></table></details>
