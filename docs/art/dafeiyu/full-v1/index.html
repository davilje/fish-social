<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>大肥鱼 · 完整钓鱼动作</title>
  <link rel="stylesheet" href="review.css">
</head>
<body>
<main>
  <header><p class="eyebrow">DAFEIYU · CHARACTER ANIMATION</p><h1>大肥鱼 · 完整钓鱼动作</h1><p>沿用蓝发鲸鱼女仆外观，覆盖站坐、挂饵、抛钩、等待、咬钩、发力、收获、空军、复位、打窝与离席。</p></header>
  <nav class="toolbar" aria-label="动作控制">
    <label>动作 <select id="clip"></select></label>
    <label>速度 <select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option><option value="2">2×</option></select></label>
    <button id="previous">上一帧</button><button id="play" aria-pressed="false">播放动作</button><button id="next">下一帧</button>
    <button id="success">完整钓鱼 · 收获</button><button id="empty">完整钓鱼 · 空军</button>
    <label><input id="loop" type="checkbox" checked>循环当前动作</label>
  </nav>
  <div class="settings"><label><input id="seat" type="checkbox" checked>默认板凳</label><label><input id="checker" type="checkbox">透明棋盘</label><label>发力时长 <input id="effort-duration" type="number" min="1" max="30" value="3"> 秒</label></div>
  <p id="status" role="status"></p><p id="error" role="alert"></p>
  <section class="comparison"><article><h2 id="caption">大肥鱼</h2><div id="stage" class="stage"></div></article><article><h2>原猫咪 · 同一模板帧</h2><div id="original" class="stage"></div></article></section>
  <fieldset id="layers"><legend>独立图层 · 可单独检查完整鱼竿与遮挡</legend></fieldset>
  <div class="links"><a id="character-link" href="#">角色透明 PNG</a><a id="composite-link" href="#">当前合成 PNG</a><a href="preview.png">动作总览</a><a href="pack/dafeiyu/manifest.json">运行素材清单</a><a href="README.md">素材与制作说明</a><a href="../../whale-maid/template-study-v1/index.html">原六姿势试绘</a></div>
  <section id="grid" aria-label="动作帧"></section>
</main>
<script src="data.js"></script><script src="review.js"></script>
</body>
</html>
