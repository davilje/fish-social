<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>喵与鱼 · 鱼种素材总览</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#f7f0e4;color:#69462f;font:16px system-ui,sans-serif}header{max-width:1600px;margin:auto auto 24px}h1{margin:0 0 10px}p{line-height:1.7}input,button{font:inherit;border:1px solid #dcc5a5;background:#fffaf2;border-radius:12px;padding:12px 18px;color:inherit}input{width:min(440px,70vw)}button{cursor:pointer}#status{display:inline-block;margin:12px}main{max-width:1600px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}.card{background:#fffbf3;border:1px solid #e3d0b5;border-radius:18px;overflow:hidden;padding:12px}.art{height:195px;display:flex;align-items:center;justify-content:center;border-radius:12px;background-color:#e0e9e4;background-image:linear-gradient(45deg,#ffffff30 25%,transparent 25%,transparent 75%,#ffffff30 75%),linear-gradient(45deg,#ffffff30 25%,transparent 25%,transparent 75%,#ffffff30 75%);background-size:24px 24px;background-position:0 0,12px 12px}.dark .art{background-color:#38414b}.crop{position:relative;overflow:hidden;flex:none}.crop img{position:absolute;max-width:none}.single{width:100%;height:100%;object-fit:contain;padding:10px}h2{font-size:19px;margin:14px 4px 6px}.id{font:13px monospace;color:#987459;margin:0 4px 12px}small{display:block;margin:0 4px;color:#987459}.missing{outline:3px solid #c14837}.hidden{display:none}a{color:inherit}footer{max-width:1600px;margin:30px auto;line-height:1.8}
</style></head><body><header><h1>喵与鱼 · 鱼种素材总览</h1><p>50 个游戏条目 · 一条 ID 对应一张鱼图 · 可切换深色底检查透明边缘</p><input id="search" placeholder="搜索鱼名或 speciesId" aria-label="搜索鱼种"><button id="theme">切换深色底</button><span id="status">正在载入图片…</span></header><main id="grid"></main><footer>6 张既有素材保留为图集切片，44 张新增素材为独立 PNG。团头鲂/武昌鱼、青鱼/巨青按游戏原有条目保留。<br><a href="README.md">查看资源路径与接入说明</a></footer>
<script>
const entries=[{"speciesId":"crucian","displayName":"鲫鱼","resourcePath":"Desktop/Theme/Cozy/items/fish/crucian","spriteName":""},{"speciesId":"carp","displayName":"鲤鱼","resourcePath":"Desktop/Theme/Cozy/items/fish-atlas","spriteName":"carp","rect":[527,608,487,296]},{"speciesId":"grass_carp","displayName":"草鱼","resourcePath":"Desktop/Theme/Cozy/items/fish-atlas","spriteName":"grass_carp","rect":[13,636,494,254]},{"speciesId":"silver_carp","displayName":"鲢鱼","resourcePath":"Desktop/Theme/Cozy/items/fish/silver_carp","spriteName":""},{"speciesId":"bighead_carp","displayName":"鳙鱼","resourcePath":"Desktop/Theme/Cozy/items/fish/bighead_carp","spriteName":""},{"speciesId":"black_carp","displayName":"青鱼","resourcePath":"Desktop/Theme/Cozy/items/fish-atlas","spriteName":"black_carp","rect":[15,164,494,283]},{"speciesId":"tilapia","displayName":"罗非鱼","resourcePath":"Desktop/Theme/Cozy/items/fish/tilapia","spriteName":""},{"speciesId":"loach","displayName":"泥鳅","resourcePath":"Desktop/Theme/Cozy/items/fish/loach","spriteName":""},{"speciesId":"bream","displayName":"鳊鱼","resourcePath":"Desktop/Theme/Cozy/items/fish/bream","spriteName":""},{"speciesId":"bluntnose_bream","displayName":"团头鲂","resourcePath":"Desktop/Theme/Cozy/items/fish/bluntnose_bream","spriteName":""},{"speciesId":"white_amur_bream","displayName":"长春鳊","resourcePath":"Desktop/Theme/Cozy/items/fish/white_amur_bream","spriteName":""},{"speciesId":"mandarin","displayName":"鳜鱼","resourcePath":"Desktop/Theme/Cozy/items/fish/mandarin","spriteName":""},{"speciesId":"topmouth","displayName":"翘嘴鲌","resourcePath":"Desktop/Theme/Cozy/items/fish/topmouth","spriteName":""},{"speciesId":"black_bass","displayName":"大口黑鲈","resourcePath":"Desktop/Theme/Cozy/items/fish-atlas","spriteName":"largemouth_bass","rect":[1029,149,496,299]},{"speciesId":"snakehead","displayName":"乌鳢","resourcePath":"Desktop/Theme/Cozy/items/fish-atlas","spriteName":"snakehead","rect":[1028,663,500,217]},{"speciesId":"catfish","displayName":"鲶鱼","resourcePath":"Desktop/Theme/Cozy/items/fish/catfish","spriteName":""},{"speciesId":"yellow_catfish","displayName":"黄颡鱼","resourcePath":"Desktop/Theme/Cozy/items/fish/yellow_catfish","spriteName":""},{"speciesId":"silver_bream","displayName":"银鲴","resourcePath":"Desktop/Theme/Cozy/items/fish/silver_bream","spriteName":""},{"speciesId":"redfin","displayName":"红鳍鲌","resourcePath":"Desktop/Theme/Cozy/items/fish/redfin","spriteName":""},{"speciesId":"river_chub","displayName":"马口鱼","resourcePath":"Desktop/Theme/Cozy/items/fish/river_chub","spriteName":""},{"speciesId":"chinese_sabre","displayName":"鳡鱼","resourcePath":"Desktop/Theme/Cozy/items/fish/chinese_sabre","spriteName":""},{"speciesId":"redeye","displayName":"赤眼鳟","resourcePath":"Desktop/Theme/Cozy/items/fish/redeye","spriteName":""},{"speciesId":"longsnout_cat","displayName":"长吻鮠","resourcePath":"Desktop/Theme/Cozy/items/fish/longsnout_cat","spriteName":""},{"speciesId":"wuchang_bream","displayName":"武昌鱼","resourcePath":"Desktop/Theme/Cozy/items/fish/wuchang_bream","spriteName":""},{"speciesId":"cn_mahseer","displayName":"光唇鱼","resourcePath":"Desktop/Theme/Cozy/items/fish/cn_mahseer","spriteName":""},{"speciesId":"rock_carp","displayName":"岩原鲤","resourcePath":"Desktop/Theme/Cozy/items/fish/rock_carp","spriteName":""},{"speciesId":"barbel","displayName":"花鲴","resourcePath":"Desktop/Theme/Cozy/items/fish/barbel","spriteName":""},{"speciesId":"snow_trout","displayName":"裂腹鱼","resourcePath":"Desktop/Theme/Cozy/items/fish/snow_trout","spriteName":""},{"speciesId":"golden_line","displayName":"金线鲃","resourcePath":"Desktop/Theme/Cozy/items/fish/golden_line","spriteName":""},{"speciesId":"bronze_carp","displayName":"铜鱼","resourcePath":"Desktop/Theme/Cozy/items/fish/bronze_carp","spriteName":""},{"speciesId":"black_porgy","displayName":"黑鲷","resourcePath":"Desktop/Theme/Cozy/items/fish/black_porgy","spriteName":""},{"speciesId":"red_porgy","displayName":"真鲷","resourcePath":"Desktop/Theme/Cozy/items/fish/red_porgy","spriteName":""},{"speciesId":"yellow_croaker","displayName":"大黄鱼","resourcePath":"Desktop/Theme/Cozy/items/fish/yellow_croaker","spriteName":""},{"speciesId":"hairtail","displayName":"带鱼","resourcePath":"Desktop/Theme/Cozy/items/fish/hairtail","spriteName":""},{"speciesId":"chinese_mackerel","displayName":"鲐鱼","resourcePath":"Desktop/Theme/Cozy/items/fish/chinese_mackerel","spriteName":""},{"speciesId":"flounder","displayName":"牙鲆","resourcePath":"Desktop/Theme/Cozy/items/fish/flounder","spriteName":""},{"speciesId":"sea_bass","displayName":"花鲈","resourcePath":"Desktop/Theme/Cozy/items/fish/sea_bass","spriteName":""},{"speciesId":"pomfret","displayName":"银鲳","resourcePath":"Desktop/Theme/Cozy/items/fish/pomfret","spriteName":""},{"speciesId":"grouper","displayName":"石斑鱼","resourcePath":"Desktop/Theme/Cozy/items/fish/grouper","spriteName":""},{"speciesId":"mullet","displayName":"鲻鱼","resourcePath":"Desktop/Theme/Cozy/items/fish/mullet","spriteName":""},{"speciesId":"rainbow_trout","displayName":"虹鳟","resourcePath":"Desktop/Theme/Cozy/items/fish/rainbow_trout","spriteName":""},{"speciesId":"lenok","displayName":"细鳞鲑","resourcePath":"Desktop/Theme/Cozy/items/fish/lenok","spriteName":""},{"speciesId":"taimen","displayName":"哲罗鲑","resourcePath":"Desktop/Theme/Cozy/items/fish/taimen","spriteName":""},{"speciesId":"whitefish","displayName":"雅罗鱼","resourcePath":"Desktop/Theme/Cozy/items/fish/whitefish","spriteName":""},{"speciesId":"chinese_sturgeon","displayName":"中华鲟","resourcePath":"Desktop/Theme/Cozy/items/fish/chinese_sturgeon","spriteName":""},{"speciesId":"dabry_sturgeon","displayName":"达氏鲟","resourcePath":"Desktop/Theme/Cozy/items/fish/dabry_sturgeon","spriteName":""},{"speciesId":"eel","displayName":"鳗鲡","resourcePath":"Desktop/Theme/Cozy/items/fish/eel","spriteName":""},{"speciesId":"ricefield_eel","displayName":"黄鳝","resourcePath":"Desktop/Theme/Cozy/items/fish/ricefield_eel","spriteName":""},{"speciesId":"koi","displayName":"锦鲤","resourcePath":"Desktop/Theme/Cozy/items/fish-atlas","spriteName":"koi","rect":[521,140,497,303]},{"speciesId":"giant_black_carp","displayName":"巨青","resourcePath":"Desktop/Theme/Cozy/items/fish/giant_black_carp","spriteName":""}];
const grid=document.getElementById('grid');let loaded=0,failed=0;
const update=()=>document.getElementById('status').textContent='已加载 '+loaded+' / '+entries.length+(failed?' · 缺失 '+failed:'');
entries.forEach((entry,index)=>{
 const card=document.createElement('article');card.className='card';card.dataset.search=(entry.displayName+' '+entry.speciesId).toLowerCase();
 const art=document.createElement('div');art.className='art';const img=new Image();img.alt=entry.displayName;img.onload=()=>{loaded++;update()};img.onerror=()=>{failed++;card.classList.add('missing');update()};
 img.src='../../../fish-social-unity/Assets/Resources/'+entry.resourcePath+'.png';
 if(entry.rect){const [left,top,width,height]=entry.rect;const scale=Math.min(248/width,175/height);const crop=document.createElement('div');crop.className='crop';crop.style.width=width*scale+'px';crop.style.height=height*scale+'px';img.style.width=1536*scale+'px';img.style.height=1024*scale+'px';img.style.left=-left*scale+'px';img.style.top=-top*scale+'px';crop.append(img);art.append(crop)}else{img.className='single';art.append(img)}
 const title=document.createElement('h2');title.textContent=String(index+1).padStart(2,'0')+'  '+entry.displayName;
 const id=document.createElement('p');id.className='id';id.textContent=entry.speciesId;
 const note=document.createElement('small');note.textContent=entry.spriteName?'既有图集独立切片':'独立透明 PNG';
 card.append(art,title,id,note);grid.append(card);
});
document.getElementById('search').addEventListener('input',event=>{const query=event.target.value.trim().toLowerCase();for(const card of grid.children)card.classList.toggle('hidden',!card.dataset.search.includes(query))});
document.getElementById('theme').addEventListener('click',()=>document.body.classList.toggle('dark'));
</script></body></html>
