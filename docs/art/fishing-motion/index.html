<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>22D / 22F · 钓鱼动作对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6efe4;color:#624631;font:16px system-ui,sans-serif}main{max-width:1380px;margin:auto;padding:28px}h1{font-size:26px;margin:0 0 10px}p{line-height:1.6}header,section{background:#fffaf1;border:1px solid #dfceb7;border-radius:20px;padding:22px;margin-bottom:18px}.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center}button,select,input{font:inherit;color:inherit;border:1px solid #d8bfa1;border-radius:10px;background:#fff9ed;padding:10px}button{cursor:pointer}button.primary{background:#f1b16c}label{display:flex;gap:8px;align-items:center}input[type=number]{width:85px}.views{display:grid;grid-template-columns:1fr 1fr;gap:18px}article{min-width:0}canvas{display:block;width:100%;background:repeating-conic-gradient(#eee7dc 0% 25%,#f8f4ec 0% 50%) 0/24px 24px;border:1px solid #e1cdb3;border-radius:12px}h2{font-size:18px}output{display:block;min-height:50px;margin-top:10px;line-height:1.6}.note{color:#8a6a51;font-size:14px}input[type=range]{flex:1;min-width:240px}@media(max-width:800px){.views{grid-template-columns:1fr}}a{color:#92613c}
</style>
<main>
<header><h1>钓鱼动作对照 · 22D / 22F</h1>
<p>覆盖 14 种动作及十个角色，保持原关键姿势、遮挡顺序与单段时长。连续动作增加轨迹过渡，等待浮标轻摆；静态站立与准备姿势不添加晃动。</p>
<div class="controls"><label>角色<select id="pet"></select></label><label>动作<select id="clip"></select></label><label>速度<select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select></label><label>打窝秒数<input id="duration" type="number" min="0.1" max="120" step="0.1" value="5"></label><label>水面高度<input id="surface" type="number" min="464" max="620" step="10" value="572"></label><button id="play" class="primary">暂停</button><button id="restart">重新播放</button><button id="finish">结束打窝</button></div></header>
<section class="views"><article><h2>原关键帧 / 原水下深度</h2><canvas id="before" width="640" height="740"></canvas><output id="before-info"></output></article><article><h2>新增采样 / 加深落点</h2><canvas id="after" width="640" height="740"></canvas><output id="after-info"></output></article></section>
<section><div class="controls"><button id="previous">上一帧</button><input id="scrub" type="range" min="0" max="1000" value="0"><button id="next">下一帧</button></div><p class="note" id="summary"></p><p class="note">此处读取正式 Overlay 的图层与采样数据，并模拟相同的水面修正。水面高度是画布坐标，实际 Overlay 按座位位置计算。打窝时长模拟服务器阶段，正式程序以 groundbaiting 退出为准。预览范围向水下扩展，不改变角色原图尺寸；不能替代 Windows 实机验收。</p></section>
</main><script src="preview-data.js"></script><script src="preview.js"></script>
</html>
