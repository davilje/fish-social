<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资料与收获 · Web / Unity</title><style>*{box-sizing:border-box}body{margin:0;background:#29241f;color:#f5e8d4;font:16px system-ui,sans-serif}header,nav,footer{padding:18px 24px}h1{font-size:25px;font-weight:500;margin:0 0 12px}p{color:#c8b79e;line-height:1.8}a{color:#ffc987}nav{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;padding:10px 15px;border:1px solid #73614d;border-radius:10px;background:#40372e;color:#e9dac3;cursor:pointer}button[aria-pressed=true]{background:#ffa051;color:#35271b}button:focus-visible,a:focus-visible{outline:3px solid #7bbcdf}main{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:0 18px}figure{margin:0;min-width:0}figcaption{padding:10px;font-size:18px}img{display:block;width:100%;height:auto;border-radius:10px}.single main{grid-template-columns:1fr}.single figure:first-child{display:none}@media(max-width:1000px){main{grid-template-columns:1fr}}small{color:#c8b79e}</style><header><h1>资料与收获 · Web / Unity</h1><p>左侧是确认的网页设计，右侧是保存后的正式 Unity 预制体渲染。业务内容使用示例数据，两侧画面按窗口宽度显示。</p><a href="../../../design/ui/prototype/journal-workspace/index.html">打开可交互网页方案</a> · <a href="index.html">全部 Unity 页面</a> · <a href="evidence.json">验证记录</a></header><nav><button data-page="0" aria-pressed="true">个人资料</button><button data-page="1" aria-pressed="false">编辑资料 · 头像</button><button data-page="2" aria-pressed="false">编辑资料 · 展示位</button><button data-page="3" aria-pressed="false">选择展示鱼获</button><button data-page="4" aria-pressed="false">分享鱼获</button><button data-page="5" aria-pressed="false">离塘结算</button><button id="single">只看 Unity</button></nav><main><figure><figcaption>Web 方案</figcaption><img id="web" alt="Web方案截图"></figure><figure><figcaption>Unity 实际渲染</figcaption><img id="unity" alt="Unity正式预制体截图"></figure></main><footer><small>这些是页面截图，操作请使用网页交互预览或 Unity。真实接入保留 10 个头像、可选附言、入包/回塘筛选；回塘鱼获不可发布。资料统计使用实际已有字段，未伪造网页演示的累计时长与水域数。</small></footer><script>const pages=[["PanelProfileHub","profile","个人资料"],["PanelProfileEdit","edit","编辑资料 · 头像"],["PanelProfileEdit-展示鱼获","edit-showcase","编辑资料 · 展示位"],["PanelProfileEdit-选择鱼获","picker","选择展示鱼获"],["PanelSocialFeed-发布","compose","分享鱼获"],["PanelPondSettlement","settlement","离塘结算"]],buttons=[...document.querySelectorAll('[data-page]')];function show(i){const p=pages[i];document.getElementById('web').src=p[0]+'-workspace-web.webp';document.getElementById('unity').src=p[0]+'.webp';buttons.forEach((b,j)=>b.setAttribute('aria-pressed',i===j));history.replaceState(null,'','#'+encodeURIComponent(p[0]))}buttons.forEach((b,i)=>b.onclick=()=>show(i));document.getElementById('single').onclick=e=>{document.body.classList.toggle('single');e.target.textContent=document.body.classList.contains('single')?'Web / Unity 对照':'只看 Unity'};show(Math.max(0,pages.findIndex(p=>p[0]===decodeURIComponent(location.hash.slice(1)))));</script></html>
