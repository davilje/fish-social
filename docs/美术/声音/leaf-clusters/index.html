<body><main><span class="badge">环境试听 · 已应用项目</span><h1>湖畔的风与叶</h1><p class="muted">风和叶声大部分相伴，缓缓起伏。风弱时，叶声也轻一点；偶尔风歇下来，余响自然淡去。</p>
<section class="card" aria-label="完整环境试听"><div class="scene" aria-hidden="true"><span>坐在湖边，听风穿过树叶。</span></div><div class="selectors"><label for="duration">试听时长 <select id="duration"><option value="60" selected>1 分钟</option><option value="180">3 分钟</option><option value="0">持续播放</option></select></label><label for="waterProfile">水面声音 <select id="waterProfile"><option value="calm" selected>平静湖面</option><option value="ripples">轻晃水面</option><option value="shore">河岸水声（对照）</option></select></label></div>
<div class="controls"><button id="play" class="primary" disabled>开始试听</button><button id="new" disabled>换一段风势</button><button id="stop">柔和停止</button><button id="immediate" class="immediate">立即静音</button></div><div class="progress-row"><progress id="progress" value="0" max="60" aria-label="试听进度"></progress><span id="progressLabel">尚未开始</span></div><p id="status" role="status">正在准备试听…</p>
<label class="master" for="master">整体音量 <output id="masterValue">70%</output><input id="master" type="range" min="0" max="100" value="70"></label><div class="sliders"><label for="water">湖面水声 <output id="waterValue">100%</output><input id="water" type="range" min="0" max="100" value="100"></label><label for="wind">风声音量 <output id="windValue">100%</output><input id="wind" type="range" min="0" max="100" value="100"></label><label for="leaves">叶声音量 <output id="leavesValue">100%</output><input id="leaves" type="range" min="0" max="100" value="100"></label></div></section>
<section class="card"><h2>完整混音 · 45 秒</h2><p class="muted recording-note">先听这一段，感受湖面、风声与树叶交融的强弱变化。</p><audio id="recording" controls preload="none" src="continuous-breeze.wav?v=20261030-flowing"></audio></section>
<details class="card"><summary>已认可的动作／猫叫试听</summary><p class="muted">需要时再展开原试听页。环境试听与这里的声音轮流播放。</p><button id="loadEffects">打开动作与猫叫试听</button><div id="effectsHost"></div></details>
<footer>使用现有湖面、户外风与树叶实录制作。当前风叶方案已应用项目；本页调节仅影响试听，不会改变游戏内的音量设置。</footer></main><script type="module" src="preview.js?v=20261030-flowing-applied"></script></body></html>
