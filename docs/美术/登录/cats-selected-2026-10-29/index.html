<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录场景 · 浅蓝青调色配色</title>
<script>if(window.top===window.self)location.replace('../../../../现行预览.html#login');</script>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f0e8;color:#3f574d;font:14px/1.6 system-ui,"PingFang SC",sans-serif}main{max-width:1500px;padding:20px;margin:auto}h1{font-size:22px;margin:0 0 6px}p{margin:0 0 14px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}button,select,a{font:inherit}button,select{background:#fffdf6;color:#3f574d;border:1px solid #bac7bc;border-radius:7px;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:#3f6254;color:white}button:focus-visible,select:focus-visible{outline:3px solid #aa7840;outline-offset:2px}.stage{width:100%;border-radius:10px;overflow:hidden;background:#dce8e1}.stage img{width:100%;display:block}a{color:#3c6855}.note{font-size:13px;margin:14px 0;color:#69796d}</style>
</head><body><main>
<h1>湖畔烤鱼 · 浅蓝青调色</h1><p>调整天空和湖水的色相、饱和度，保持明亮观感与粉彩笔触。</p>
<div class="bar"><button data-mode="unity" aria-pressed="true">当前 Unity 画面</button><button data-mode="color" aria-pressed="false">当前原画</button><button data-mode="previous" aria-pressed="false">调整前原画</button><button data-mode="beforeUI" aria-pressed="false">调整前界面</button><button data-mode="art" aria-pressed="false">最初原画</button>
<select aria-label="查看窗口尺寸" id="resolution"><option>1920x1080</option><option>1280x720</option><option>1600x900</option><option>2560x1440</option><option>1280x800</option><option>1024x768</option><option>2560x1080</option></select></div>
<div class="stage"><img id="scene" src="unity-login-1920x1080.png?v=hue-saturation-v2" alt="浅蓝青调色色的五猫湖畔登录场景"></div>
<p class="note" id="caption" role="status"></p>
<a href="login-background-hue-saturation-v2.png" target="_blank">打开当前原画</a> · <a href="color-prompt-hue-saturation-v2.txt">内置图像生成提示词</a> · <a href="README.md">应用与验证记录</a>
</main><script>
let mode='unity';const sel=document.querySelector('#resolution'),img=document.querySelector('#scene'),caption=document.querySelector('#caption');
const images={color:'login-background-hue-saturation-v2.png',previous:'login-background-fish-fixed-2026-10-30.png',beforeUI:'unity-login-before-2026-10-31.png',art:'login-background-cats-selected.png',fishBefore:'login-background-color-soft-2026-10-30.png',before:'../cats-v4/login-background-cats-v4.png'};
function update(){img.src=mode==='unity'?`unity-login-${sel.value}.png?v=hue-saturation-v2`:images[mode];caption.textContent=mode==='unity'?`项目内完整画布 · ${sel.value} · 浅蓝青调色配色，保留原有独立控件和等比覆盖布局。`:mode==='color'?'当前正式原画：天空与湖水减少蓝青色饱和度，保持明亮观感。':mode==='previous'?'本轮调整前原画：用于比较天空、湖水与植被的颜色。':mode==='beforeUI'?'本轮调整前的 Unity 界面（1920×1080）。':'最初采用原画，供历史对照。';sel.disabled=mode!=='unity';}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));update();});sel.onchange=update;update();
</script></body></html>
