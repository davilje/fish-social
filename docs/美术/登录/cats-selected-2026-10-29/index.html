rompt.txt">原绘图提示词（第一轮）</a></main><script>let mode='unity';const sel=document.querySelector('#resolution'),img=document.querySelector('#scene'),caption=document.querySelector('#caption');function update(){img.src=mode==='fishBefore'?'login-background-color-soft-2026-10-30.png':mode==='color'?'login-background-fish-fixed-2026-10-30.png':mode==='unity'?`unity-login-${sel.value}.png?v=fishfix-20261030`:mode==='art'?'login-background-cats-selected.png':'../cats-v4/login-background-cats-v4.png';caption.textContent=mode==='fishBefore'?'修复前的柔和调色原画：用于对照烤鱼结构。':mode==='color'?'修复后的正式原画：修正重复鱼头、眼睛、鱼鳍和头尾结构，沿用已确认的柔和调色。':mode==='unity'?`已修复烤鱼细节 · Unity 完整画布渲染 · ${sel.value}。等比覆盖背景，控件独立布局，旧主界面背景在登录态隐藏。`:mode==='art'?'用户指定采用的版本，源文件原样复制。':'上一版 v4 背景原画，供环境细节对比。';sel.disabled=mode!=='unity'}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));update()});sel.onchange=update;update();</script></html>
