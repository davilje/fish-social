<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录场景 · 已采用版本</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f0e8;color:#3f574d;font:15px/1.6 system-ui,"PingFang SC",sans-serif}main{max-width:1400px;padding:28px;margin:auto}h1{font-size:28px;margin:0 0 8px}p{margin:0 0 18px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}button,select,a{font:inherit}button,select{background:#fffdf6;color:#3f574d;border:1px solid #bac7bc;border-radius:7px;padding:8px 14px;cursor:pointer}button[aria-pressed=true]{background:#3f6254;color:white}button:focus-visible,select:focus-visible{outline:3px solid #aa7840;outline-offset:2px}.stage{width:100%;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px #31463822}.stage img{width:100%;display:block}a{color:#3c6855}.note{font-size:13px;margin:16px 0;color:#69796d}</style><main><h1>湖畔烤鱼 · 已采用版本</h1><p>采用你指定的原图 · 五猫围坐 · 完整窗口效果</p><div class="bar"><button data-mode="unity" aria-pressed="true">Unity 完整画面</button><button data-mode="art" aria-pressed="false">背景原画</button><button data-mode="before" aria-pressed="false">上一版背景</button><select aria-label="查看窗口尺寸" id="resolution"><option>1920x1080</option><option>1280x720</option><option>1600x900</option><option>2560x1440</option><option>1280x800</option><option>1024x768</option><option>2560x1080</option></select></div><div class="stage"><img id="scene" src="unity-login-1920x1080.png" alt="修复后的 Unity 全窗口登录场景"></div><p class="note" id="caption">Unity 完整画布渲染，保留正式 CanvasScaler。可切换窗口尺寸检查覆盖、裁切和猫咪与控件间距。</p><a href="login-background-cats-selected.png" target="_blank">打开背景原图 ↗</a> · <a href="README.md">采用与验证记录</a> · <a href="../cats-v5/generation-prompt.txt">原绘图提示词（第一轮）</a></main><script>let mode='unity';const sel=document.querySelector('#resolution'),img=document.querySelector('#scene'),caption=document.querySelector('#caption');function update(){img.src=mode==='unity'?`unity-login-${sel.value}.png`:mode==='art'?'login-background-cats-selected.png':'../cats-v4/login-background-cats-v4.png';caption.textContent=mode==='unity'?`Unity 完整画布渲染 · ${sel.value}。等比覆盖背景，控件独立布局，旧主界面背景在登录态隐藏。`:mode==='art'?'用户指定采用的版本，源文件原样复制。':'上一版 v4 背景原画，供环境细节对比。';sel.disabled=mode!=='unity'}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));update()});sel.onchange=update;</script></html>
