<main><p><a href="../cats-selected-2026-10-29/index.html">查看当前已采用的登录场景 →</a></p><h1>找回粉彩笔触的层次</h1><p>恢复叠色与干刷边缘 · 控制细节密度 · 五只猫仍是重心</p>

<script>const modes={new:['login-background-cats-v6.png','新版效果图：恢复中等大小的叠色笔触与不规则边缘，保留猫咪周围的留白。'],old:['../cats-v5/login-background-cats-v5.png','上一版 v5：色块过于简化，用于比较笔触与层次。'],ref:['../cats-v5/style-reference.png','用户提供的画风参考：疏朗草岸、大色块和柔和粉彩笔触。']};document.querySelectorAll('button[data-mode]').forEach(b=>b.onclick=()=>{const [src,note]=modes[b.dataset.mode];document.querySelector('#scene').src=src;document.querySelector('#caption').textContent=note;document.querySelectorAll('button[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});</script></html>
