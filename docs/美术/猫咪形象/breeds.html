<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>猫咪素材 · 全品种动作对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5eee3;color:#624932;font:16px/1.6 system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:24px}h1{margin:0}p{margin:8px 0}.bar{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:20px 0}button,select{font:inherit;color:inherit;border:1px solid #ceb89f;border-radius:8px;padding:8px 12px;background:#fffaf2;cursor:pointer}button[aria-current=true]{outline:3px solid #b67c41}.stage{display:grid;grid-template-columns:1fr 1fr;gap:18px}figure{margin:0;background:#fffaf2;border-radius:14px;padding:12px}canvas{width:100%;display:block;background:#e4e1d9;border-radius:8px}figcaption{padding:8px}#grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:18px}#grid button{padding:4px;font-size:12px}#grid img{width:100%;display:block;aspect-ratio:5/4;object-fit:contain;background:#e4e1d9}#status{padding:10px;background:#fff2dc;border-left:4px solid #ba8a50}#error{color:#a42b24}a{color:inherit}@media(max-width:760px){.stage{grid-template-columns:1fr}#grid{grid-template-columns:repeat(3,1fr)}}
</style>
<main>
<h1>猫咪素材 · 全品种动作对照</h1>
<p>同一套动作、画布和道具层。切换品种可对照轮廓；逐帧检查耳斑、毛纹和双手遮挡。</p>
<p><a href="full.html">三花猫修订前后对照</a> · <a href="../大肥鱼/hd-v2/index.html">大肥鱼高清完整动作</a></p>
<div class="bar">
<label>猫咪 <select id="breed"></select></label>
<label>动作 <select id="clip"></select></label>
<label>显示 <select id="mode"><option value="full">含道具分层</option><option value="character">仅猫咪</option></select></label>
<label>速度 <select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select></label>
<button id="previous">上一帧</button><button id="play" aria-pressed="false">播放</button><button id="next">下一帧</button>
</div>
<p id="status"></p><p id="error" role="alert"></p>
<section class="stage">
<figure><canvas id="current" width="640" height="512"></canvas><figcaption id="caption"></figcaption></figure>
<figure><canvas id="original" width="640" height="512"></canvas><figcaption>原版橘猫 · 同一帧、同一图层顺序</figcaption></figure>
</section>
<section id="grid" aria-label="动作帧列表"></section>
</main>
<script src="breed-review-data.js"></script><script src="breeds.js"></script>
</html>
