<body>
<main>
  <header><p class="eyebrow">DAFEIYU · CHARACTER ANIMATION</p><h1>大肥鱼 · 高清统一尺寸 v2</h1><p>角色图层 1280×1024 · 统一头部尺度 · 逻辑坐标 640×512。覆盖全部动作，右侧可对照旧版或猫咪模板。</p></header>
