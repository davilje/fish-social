<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>场景分层 · 静态背景与树叶</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; flex-direction: column; gap: 8px;
      height: 100%; padding: 10px 12px 12px;
      background: #f6f3ee; color: #1c1917;
      font: 15px/1.45 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    header { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; flex: none; }
    h1 { margin: 0; font-size: 18px; font-weight: 700; }
    label { display: flex; gap: 8px; align-items: center; color: #78716c; }
    select, button {
      font: inherit; color: #1c1917; padding: 6px 10px;
      background: #fffcf7; border: 1px solid #e7e0d5; border-radius: 8px;
    }
    button { cursor: pointer; }
    button:hover { border-color: #0e7490; }
    p { margin: 0; color: #78716c; flex: none; }
    .stage {
      flex: 1; min-height: 0; min-width: 0; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    canvas {
      display: block; flex: none;
      background: #e7e5e4; border: 1px solid #e7e0d5; border-radius: 12px;
    }
    canvas.isolated {
      background-color: #fff;
      background-image: conic-gradient(#e5e7eb 25%, transparent 0 50%, #e5e7eb 0 75%, transparent 0);
      background-size: 20px 20px;
    }
    #layer-info { font-size: 13px; overflow-wrap: anywhere; }
    select { max-width: min(100%, 360px); }
  </style>
</head>
<body>
  <header>
    <h1>场景分层</h1>
    <label>鱼塘 <select id="pond"></select></label>
    <label>查看 <select id="layer-view"><option value="all">完整场景</option><option value="sky">无云天空</option><option value="back">后景与静态云</option><option value="middle">中景</option><option value="front">前景</option><option value="leaves">树叶与植被</option></select></label>
    <button id="play" type="button">暂停</button>
    <label>速度 <select id="rate"><option value="1">1×</option><option value="10">10×</option><option value="30">30×</option></select></label>
  </header>
  <p id="status">正在读取场景…</p>
  <p id="layer-info" aria-live="polite">可在“查看”中选择单个图层，透明区域以棋盘格显示。</p>
  <div class="stage"><canvas id="view" width="1680" height="560"></canvas></div>
  <script>
    const root = '../../../fish-social-unity/Assets/Desktop/OverlayArt/Ponds/';
    const view = document.querySelector('#view');
    const stage = document.querySelector('.stage');
    const ctx = view.getContext('2d');
    const pondSelect = document.querySelector('#pond');
    const status = document.querySelector('#status');
    const playButton = document.querySelector('#play');
    const layerView = document.querySelector('#layer-view');
    const layerInfo = document.querySelector('#layer-info');
    const layerNames = {
      'pond-bg': '无云天空', 'scene-celestial': '太阳／月亮',
      'scene-cloud-far': '原图静态云与天空纹理',
      'scene-cloud-middle': '云通道二', 'scene-cloud-near': '云通道三',
      'scene-far': '远景', 'scene-far-dam': '远林与水坝',
      'scene-middle': '中景与固定树干', 'scene-middle-slope': '坡地与中景',
      'scene-foliage-mid': '中景树叶与灌木', 'scene-foliage-near': '近景树冠',
      'scene-tree-left': '左侧树群', 'scene-tree-right': '右侧树群',
      'scene-shore': '岸边', 'scene-front-bank': '前景草地与岸边', 'scene-water': '水面'
    };
    function layerLabel(layer) {
      return layerNames[layer.id] || (/^scene-bush-\d+$/.test(layer.id)
        ? '中景灌木 ' + layer.id.split('-').pop() : layer.id);
    }
    function updateLayerInfo() {
      const layer = currentScene?.layers.find(item => 'layer:' + item.id === layerView.value);
      view.classList.toggle('isolated', layerView.value !== 'all');
      layerInfo.textContent = layer
        ? `${layerLabel(layer)} · ${layer.id} · ${layer.file}${layer.empty ? ' · 此通道为空透明占位' : ''}${layer.leaf ? ' · 保留风动，可暂停查看静态' : ''}`
        : '可在“单独图层”列表中逐层查看；棋盘格表示透明区域。';
    }
    function populateLayerOptions(scene) {
      const previous = layerView.value;
      layerView.replaceChildren(new Option('完整场景', 'all'));
      const single = document.createElement('optgroup'); single.label = '单独图层';
      for (const layer of scene.layers) {
        single.append(new Option(`${layer.z + 1}. ${layerLabel(layer)}${layer.empty ? '（透明占位）' : ''}`, 'layer:' + layer.id));
      }
      const groups = document.createElement('optgroup'); groups.label = '按景别组合';
      for (const [value, label] of [['sky', '无云天空'], ['back', '后景与静态云'], ['middle', '中景'], ['front', '前景'], ['leaves', '树叶与植被']]) groups.append(new Option(label, value));
      layerView.append(single, groups);
      layerView.value = [...layerView.options].some(option => option.value === previous) ? previous : 'all';
      updateLayerInfo();
    }
    let playing = true;
    let token = 0;
    let frame = 0;
    let elapsed = 0;
    let runningFrom = 0;
    let playbackRate = 1;
    let currentScene = null;

    function seconds() {
      return (elapsed + (playing ? (performance.now() - runningFrom) * playbackRate : 0)) / 1000;
    }

    function cloudAxis(time, velocity, extent, size, initial) {
      if (velocity === 0) return initial;
      const period = extent + size + 4;
      const distance = initial + size + 2 + time * velocity;
      return distance - Math.floor(distance / period) * period - size - 2;
    }

    function cloudTravel(seconds, speed, width, phase) {
      const distance = seconds * speed + (phase || 0);
      return distance - Math.floor(distance / width) * width;
    }

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error(url));
        image.src = url + '?v=original-static-clouds-v11';
      });
    }

    function paint(image, width, height) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(image, 0, 0, width, height);
      return canvas;
    }

    function sample(data, width, height, x, y) {
      if (x < -0.5 || y < -0.5 || x > width - 0.5 || y > height - 0.5) return [0, 0, 0, 0];
      x = Math.max(0, Math.min(width - 1, x));
      y = Math.max(0, Math.min(height - 1, y));
      const x0 = Math.floor(x);
      const y0 = Math.floor(y);
      const fx = x - x0;
      const fy = y - y0;
      const x1 = Math.min(x0 + 1, width - 1);
      const y1 = Math.min(y0 + 1, height - 1);
      const index = (yy, xx) => (yy * width + xx) * 4;
      const a = index(y0, x0);
      const b = index(y0, x1);
      const c = index(y1, x0);
      const d = index(y1, x1);
      const pixel = [0, 0, 0, 0];
      for (let channel = 0; channel < 4; channel++) {
        pixel[channel] = Math.round(
          (data[a + channel] * (1 - fx) + data[b + channel] * fx) * (1 - fy) +
          (data[c + channel] * (1 - fx) + data[d + channel] * fx) * fy
        );
      }
      return pixel;
    }

    function warp(layer, seconds, scale) {
      const motion = layer.leaf;
      const cropX = Math.max(0, Math.round(motion.left * scale));
      const cropY = Math.max(0, Math.round(motion.top * scale));
      const cropW = Math.max(1, Math.min(view.width - cropX, Math.round(motion.width * scale)));
      const cropH = Math.max(1, Math.min(view.height - cropY, Math.round(motion.height * scale)));
      const plate = layer.plate;
      plate.width = cropW;
      plate.height = cropH;
      const output = plate.getContext('2d').createImageData(cropW, cropH);
      const source = layer.pixels;
      const weight = layer.weightPixels;
      const amplitude = layer.amplitude * scale;
      const slow = 0.78 * Math.sin(seconds * Math.PI * 2 / motion.primaryPeriod);
      const fast = 0.22 * Math.sin(seconds * Math.PI * 2 / motion.secondaryPeriod);
      const vertical = motion.verticalRatio * Math.sin(seconds * Math.PI * 2 / motion.verticalPeriod);
      for (let y = 0; y < cropH; y++) {
        const gy = cropY + y;
        for (let x = 0; x < cropW; x++) {
          const gx = cropX + x;
          const sourceX = gx / scale;
          const dest = (y * cropW + x) * 4;
          const weightIndex = (gy * view.width + gx) * 4;
          const strength = (weight.data[weightIndex] / 255) * amplitude;
          let pixel;
          if (strength === 0) {
            const from = (gy * view.width + gx) * 4;
            pixel = [source.data[from], source.data[from + 1], source.data[from + 2], source.data[from + 3]];
          } else {
            const detail = Math.cos((sourceX + 0.5) * 0.025 + motion.phase);
            const rise = Math.sin((sourceX + 0.5) * 0.018 + motion.phase);
            pixel = sample(source.data, view.width, view.height, gx - strength * (slow + fast * detail), gy - strength * vertical * rise);
          }
          output.data[dest] = pixel[0];
          output.data[dest + 1] = pixel[1];
          output.data[dest + 2] = pixel[2];
          output.data[dest + 3] = pixel[3];
        }
      }
      const plateCtx = plate.getContext('2d');
      plateCtx.putImageData(output, 0, 0);
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, view.width, view.height);
      ctx.rect(cropX, cropY, cropW, cropH);
      ctx.clip('evenodd');
      ctx.drawImage(layer.canvas, 0, 0);
      ctx.restore();
      ctx.drawImage(plate, cropX, cropY);
    }

    function draw(scene, seconds) {
      ctx.clearRect(0, 0, view.width, view.height);
      for (const layer of scene.layers) {
        const mode = layerView.value;
        if (mode.startsWith('layer:') && mode !== 'layer:' + layer.id) continue;
        if (mode.startsWith('layer:') && !layer.leaf) {
          ctx.drawImage(layer.canvas, 0, 0);
          continue;
        }
        if (mode === 'sky' && layer.id !== 'pond-bg') continue;
        if (mode === 'back' && !['pond-bg', 'scene-celestial', 'scene-cloud-far', 'scene-cloud-middle', 'scene-cloud-near', 'scene-far', 'scene-far-dam'].includes(layer.id)) continue;
        if (mode === 'middle' && !['scene-middle', 'scene-middle-slope'].includes(layer.id) && !layer.leaf) continue;
        if (mode === 'front' && !['scene-shore', 'scene-front-bank', 'scene-water'].includes(layer.id)) continue;
        if (mode === 'leaves' && !layer.leaf) continue;
        if (layer.cloud) {
          if (layer.sprites) {
            for (const sprite of layer.sprites) {
              const spec = sprite.spec;
              const x = cloudAxis(seconds, spec.velocityX, scene.motion.width, spec.width, spec.left);
              const y = cloudAxis(seconds, spec.velocityY, scene.motion.height, spec.height, spec.top);
              ctx.drawImage(sprite.image, x * scene.scale, y * scene.scale, spec.width * scene.scale, spec.height * scene.scale);
            }
            continue;
          }
          if (scene.motion.version === 1) {
            const x = scene.motion.cloudAmplitude * Math.sin(seconds * Math.PI * 2 / scene.motion.cloudPeriod) * scene.scale;
            ctx.drawImage(layer.canvas, x, 0);
            continue;
          }
          const travel = cloudTravel(seconds, layer.cloud.speed, scene.motion.width, layer.cloud.phase) * scene.scale;
          ctx.save();
          ctx.beginPath();
          ctx.rect(0, 0, view.width, view.height);
          ctx.clip();
          const slope = layer.cloud.verticalSlope || 0;
          ctx.drawImage(layer.canvas, travel, travel * slope);
          ctx.drawImage(layer.canvas, travel - view.width, (travel - view.width) * slope);
          ctx.restore();
        } else if (layer.leaf) {
          warp(layer, seconds, scene.scale);
        } else {
          ctx.drawImage(layer.canvas, 0, 0);
        }
      }
    }

    layerView.addEventListener('change', () => {
      updateLayerInfo();
      if (currentScene) draw(currentScene, seconds());
      fit();
    });

    function tick(scene, generation) {
      if (generation !== token) return;
      frame = requestAnimationFrame(() => tick(scene, generation));
      if (!playing) return;
      draw(scene, seconds());
    }

    function fit() {
      const bounds = stage.getBoundingClientRect();
      const aspect = view.width / Math.max(1, view.height);
      const width = Math.min(bounds.width, bounds.height * aspect);
      const height = width / aspect;
      if (width < 8 || height < 8) return;
      view.style.width = Math.floor(width) + 'px';
      view.style.height = Math.floor(height) + 'px';
    }

    window.addEventListener('resize', fit);
    new ResizeObserver(fit).observe(stage);

    async function show(layoutPath, generation) {
      currentScene = null;
      cancelAnimationFrame(frame);
      const layout = await (await fetch(root + layoutPath, { cache: 'no-store' })).json();
      const sceneDir = layoutPath.slice(0, layoutPath.lastIndexOf('/') + 1);
      const motion = await (await fetch(root + sceneDir + (layout.motion || 'motion.json'), { cache: 'no-store' })).json();
      const width = 1680;
      const height = Math.round(width * layout.height / layout.width);
      view.width = width;
      view.height = height;
      fit();
      const scale = width / motion.width;
      const clouds = new Map((motion.clouds || []).map(cloud => [cloud.id, cloud]));
      if (motion.version === 1) clouds.set(motion.cloudId, {});
      const leaves = new Map((motion.leaves || []).map(leaf => [leaf.id, leaf]));
      const weights = new Map();
      const layers = [];
      for (const layer of [...layout.layers].sort((a, b) => a.z - b.z)) {
        const image = await loadImage(root + layer.image);
        const canvas = paint(image, width, height);
        const pixels = canvas.getContext('2d').getImageData(0, 0, width, height);
        let empty = true;
        for (let p = 3; p < pixels.data.length; p += 4) if (pixels.data[p]) { empty = false; break; }
        const item = { canvas, id: layer.id, file: layer.image.split('/').pop(), z: layer.z, empty };
        const cloud = clouds.get(layer.id);
        const leaf = leaves.get(layer.id);
        if (cloud) {
          item.cloud = cloud;
          if (motion.version === 3) item.sprites = await Promise.all(cloud.sprites.map(async spec => ({
            spec, image: await loadImage(root + sceneDir + spec.image)
          })));
        }
        if (leaf) {
          const weightName = leaf.weightTexture || motion.weightTexture;
          if (!weights.has(weightName)) {
            const weightImage = await loadImage(root + sceneDir + weightName);
            const weightCanvas = paint(weightImage, width, height);
            weights.set(weightName, weightCanvas.getContext('2d').getImageData(0, 0, width, height));
          }
          item.leaf = {
            left: leaf.left, top: leaf.top, width: leaf.width, height: leaf.height,
            phase: leaf.phase || 0,
            primaryPeriod: leaf.primaryPeriod || motion.primaryPeriod,
            secondaryPeriod: motion.secondaryPeriod,
            verticalRatio: motion.verticalRatio,
            verticalPeriod: motion.verticalPeriod
          };
          item.amplitude = motion.leafAmplitude;
          item.pixels = pixels;
          item.weightPixels = weights.get(weightName);
          item.plate = document.createElement('canvas');
        }
        layers.push(item);
        if (generation !== token) return;
      }
      const scene = { layers, motion, scale };
      currentScene = scene;
      populateLayerOptions(scene);
      elapsed = 0;
      runningFrom = performance.now();
      status.textContent = motion.cloudMode === 'original-static'
        ? `${pondSelect.selectedOptions[0].textContent} · 前中后景分层 · 独立无云天空 · 原图静态云 · 树叶随风轻晃`
        : `${pondSelect.selectedOptions[0].textContent} · ${layout.layers.length} 层 · ${motion.weather?.label ? motion.weather.label + ' · ' : ''}${motion.clouds?.flatMap(c => c.sprites || []).length || 0} 个云形 · ${motion.version === 3 ? '三层水平云循环 · 大云缓慢平移' : '千岛湖原有云动效'} · 树叶按权重轻晃`;
      fit();
      requestAnimationFrame(fit);
      cancelAnimationFrame(frame);
      draw(scene, 0);
      tick(scene, generation);
    }

    playButton.addEventListener('click', () => {
      if (playing) elapsed += (performance.now() - runningFrom) * playbackRate;
      playing = !playing;
      playButton.textContent = playing ? '暂停' : '播放';
      if (playing) runningFrom = performance.now();
    });

    document.querySelector('#rate').addEventListener('change', event => {
      if (playing) elapsed += (performance.now() - runningFrom) * playbackRate;
      runningFrom = performance.now();
      playbackRate = Number(event.target.value);
    });

    pondSelect.addEventListener('change', () => {
      token += 1;
      status.textContent = '正在读取场景…';
      show(pondSelect.value, token).catch(error => {
        status.textContent = '场景没有打开：' + error.message;
      });
    });

    const themeNames = { coast: '海岸', estuary: '河口', pond: '池塘', reservoir: '水库', river: '江河', lake: '湖泊' };
    const toneNames = { mint: '薄荷', coral: '珊瑚', apricot: '杏黄', mist: '薄雾', moon: '月色' };
    const unassigned = [
      'coast-05-moon', 'estuary-02-coral', 'estuary-03-apricot', 'estuary-04-mist',
      'pond-02-coral', 'pond-03-apricot', 'pond-04-mist', 'pond-05-moon',
      'reservoir-01-mint', 'reservoir-04-mist', 'reservoir-05-moon',
      'river-02-coral', 'river-03-apricot', 'river-05-moon'
    ];

    fetch(root + 'catalog.json', { cache: 'no-store' }).then(response => response.json()).then(catalog => {
      const ponds = catalog.bindings.filter(item => item.layerLayout);
      for (const pond of ponds) {
        const option = document.createElement('option');
        option.value = pond.layerLayout;
        option.textContent = pond.displayName;
        if (pond.pondId === 'pond-calm') option.selected = true;
        pondSelect.append(option);
      }
      const group = document.createElement('optgroup');
      group.label = '未分配鱼塘';
      for (const name of unassigned) {
        const [theme, , tone] = name.split('-');
        const option = document.createElement('option');
        option.value = `layered/pastel-scenes-v1/${name}/layout.json`;
        option.textContent = `${themeNames[theme] || theme} · ${toneNames[tone] || tone}`;
        group.append(option);
      }
      pondSelect.append(group);
      show(pondSelect.value, token).catch(error => {
        status.textContent = '场景没有打开：' + error.message;
      });
    });
  </script>
</body>
</html>
