<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水库·薄荷｜独立绘制植被</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f3ee;color:#263e3b;font:14px/1.6 system-ui,"PingFang SC",sans-serif}main{max-width:1700px;margin:auto;padding:22px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:23px;margin:0}p{margin:5px 0;color:#61736e}.badge{border:1px solid #b0c8ba;border-radius:22px;padding:8px 15px;color:#27684a;background:#eaf4e9}.bar{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 10px;align-items:center}button,select,a.download{padding:8px 13px;border:1px solid #ccdad2;border-radius:7px;background:#fffef9;color:#294f43;font:inherit;cursor:pointer;text-decoration:none}button.active{background:#356958;color:white}.stage,.thumb{background-color:#ecefe9;background-image:conic-gradient(#d5ddd6 25%,transparent 0 50%,#d5ddd6 0 75%,transparent 0);background-size:20px 20px}.stage{overflow:auto;border:1px solid #cbd8ce;border-radius:10px}canvas{width:100%;height:auto;display:block}.stage.native canvas{width:2172px;max-width:none}#info{min-height:26px;font-size:13px}#split{width:160px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-top:16px}.card{border:1px solid #d1dbd2;border-radius:10px;background:#fffef9;overflow:hidden}.card-head{padding:11px 13px;display:flex;align-items:center;gap:10px}.card-head b{flex:1}.thumb{width:100%;display:block;aspect-ratio:3/1;object-fit:contain}.card p{padding:9px 13px;font-size:12px;min-height:54px}.card footer{padding:0 13px 12px;display:flex;gap:8px}.note{background:#e9eee6;padding:14px 17px;border-radius:9px;margin:18px 0;font-size:13px}.note a{color:#306b58}input[type=checkbox]{width:17px;height:17px;accent-color:#356958}@media(max-width:600px){main{padding:12px}h1{font-size:19px}.cards{grid-template-columns:1fr}}
</style><main><header><div><h1>水库·薄荷 / 独立绘制植被</h1><p>同批原图作风格参考 · 完整植被模块 · 尚未替换项目场景</p></div><div class="badge" id="result">4 组植被独立绘制</div></header>
<div class="bar" id="modes"><button data-mode="composite" class="active">完整场景</button><button data-mode="original">原图</button><button data-mode="compare">左右对照</button><label><input type="checkbox" id="wind"> 风动试验</label><input type="range" id="split" min="0" max="100" value="50" aria-label="原图对照分界" hidden><button id="all">恢复全部图层</button><button id="native">1:1 查看</button></div>
<div class="stage" id="stage"><canvas id="view" width="2172" height="724"></canvas></div><p id="info">左右对照：左侧原图，右侧当前叠加。</p><div class="cards" id="cards"></div>
<div class="note">近树和中景灌木为完整独立绘制的透明素材；背景为补全的天空、云景、水坝与坡地，岸边和水面沿用原图。可关闭植被查看其后完整的背景。风动试验固定根部，让上部轻微弯动；不是将树叶从原画里剪开。<br>独立重绘会改变植物形状和像素，本版不以逐像素一致为指标。当前仅制作一张样板，尚未替换 Unity 或 Overlay。<br><a href="original.png" target="_blank">原图 PNG</a> · <a href="composite.png" target="_blank">新组合 PNG</a> · <a href="README.md" target="_blank">制作说明</a> · <a href="prompts.json" target="_blank">植被绘制提示词</a></div></main>
<script src="layers.js"></script>
<script>
const view=document.querySelector('#view'),ctx=view.getContext('2d'),info=document.querySelector('#info'),wind=document.querySelector('#wind');let mode='composite',original,layers=[],ready=false,t0=performance.now();const W=SCENE.width,H=SCENE.height;view.width=W;view.height=H;
const load=src=>new Promise((resolve,reject)=>{const i=new Image;i.onload=()=>resolve(i);i.onerror=()=>reject(Error(src));i.src=src+'?v=2'});
function plant(l,time){const b=l.bounds,amp=l.id.startsWith('tree')?4:2.8;for(let y=b.top;y<b.top+b.height;y+=2){const h=Math.min(2,b.top+b.height-y),w=Math.max(0,Math.min(1,(l.rootY-y-b.height*.32)/(b.height*.65))),dx=amp*w*w*Math.sin(time*2*Math.PI/(7.2+l.phase*.3)+l.phase)*(.78+.22*Math.cos(y*.017+l.phase));ctx.drawImage(l.image,0,y,W,h,dx,y,W,h);}}
function render(time=0){if(!ready)return;ctx.clearRect(0,0,W,H);if(mode==='original')ctx.drawImage(original,0,0);else{for(const l of layers)if(l.visible){if(wind.checked&&l.plant)plant(l,time);else ctx.drawImage(l.image,0,0);}if(mode==='compare'){const w=W*document.querySelector('#split').value/100;ctx.save();ctx.beginPath();ctx.rect(0,0,w,H);ctx.clip();ctx.drawImage(original,0,0);ctx.restore();ctx.fillStyle='#fff';ctx.fillRect(w,0,2,H);}}}
function sync(){document.querySelectorAll('[data-visible]').forEach(c=>c.checked=layers.find(l=>l.id===c.dataset.visible).visible);document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.querySelector('#split').hidden=mode!=='compare';info.textContent=(mode==='compare'?'左侧原图 / 右侧新组合 · ':mode==='original'?'显示原图 · ':'当前叠加 · ')+layers.filter(l=>l.visible).map(l=>l.label).join(' → ');render((performance.now()-t0)/1000);}
document.querySelector('#modes').addEventListener('click',e=>{if(e.target.dataset.mode){mode=e.target.dataset.mode;sync()}});document.querySelector('#all').onclick=()=>{layers.forEach(l=>l.visible=true);mode='composite';sync()};document.querySelector('#native').onclick=()=>document.querySelector('#stage').classList.toggle('native');document.querySelector('#split').oninput=sync;wind.onchange=()=>{t0=performance.now();sync()};
(async()=>{original=await load(SCENE.source);for(const [i,spec]of SCENE.layers.entries()){const image=await load(spec.file);const l={...spec,image,visible:true,phase:i*.65};layers.push(l);const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="card-head"><input type="checkbox" checked data-visible="${l.id}" aria-label="显示${l.label}"><b>${l.label}</b></div><img class="thumb" src="${l.file}?v=2" alt="${l.label}"><p>${l.plant?'完整透明植被 · 根部位置固定 · 可测试轻微风动':'静态背景图层 · 保留完整遮挡内容'}</p><footer><button>只看此层</button><a class="download" href="${l.file}" target="_blank">原尺寸 PNG</a></footer>`;card.querySelector('input').onchange=e=>{l.visible=e.target.checked;mode='composite';sync()};card.querySelector('button').onclick=()=>{layers.forEach(a=>a.visible=a.id===l.id);mode='composite';sync()};document.querySelector('#cards').append(card);}ready=true;sync();let last=0;function tick(now){if(wind.checked&&now-last>1000/24){render((now-t0)/1000);last=now;}requestAnimationFrame(tick)}requestAnimationFrame(tick);})().catch(e=>{info.textContent='加载失败：'+e.message;console.error(e)});
</script></html>
