<!doctype html><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;background:transparent}.j-podium { height: 220px; display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: end; gap: 22px; padding: 10px 7px 16px; }
.j-podium-card { height: 165px; padding: 9px 12px 22px; text-align: center !important; }
.j-podium-card.place-1 { height: 192px; background: linear-gradient(rgb(255, 247, 223), rgb(255, 255, 255)); }
.j-podium-card.place-2 { background: linear-gradient(rgb(238, 246, 252), rgb(255, 255, 255)); }
.j-podium-card.place-3 { background: linear-gradient(rgb(251, 236, 223), rgb(255, 255, 255)); }
.j-podium-card .j-rank-avatar { width: 65px; height: 65px; object-fit: contain; }
.j-podium-card.place-1 .j-rank-avatar { width: 76px; height: 76px; }
.j-podium-card .name { margin: 3px 0px 0px; font-size: 22px; }
.j-podium-card .meta { font-size: 19px; margin-top: 3px; }
.j-podium-card .meta small { font-size: 13px; }
.j-podium-label { position: absolute; bottom: -10px; left: 50%; translate: -50%; border-radius: 8px; background: rgb(248, 223, 153); color: rgb(139, 97, 43); padding: 4px 15px; font-size: 13px; white-space: nowrap; }
.place-2 .j-podium-label { background: rgb(220, 234, 241); color: rgb(109, 140, 153); }
.place-3 .j-podium-label { background: rgb(238, 209, 185); color: rgb(174, 119, 82); }
        #host{position:relative;width:69px;height:26px}
        #art{position:absolute;left:0px;top:0px;width:69px;height:26px;transform:none;translate:none;rotate:none;margin:0;padding:0;color:transparent;border-radius:8px;}
        </style><div id="host" class="place-3"><div id="美术" class="j-podium-label"></div></div>
