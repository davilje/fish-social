<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网页与 Unity · 动效逐帧对照</title><style>*{box-sizing:border-box}body{margin:0;background:#29231f;color:#faefdf;font:16px system-ui}header{padding:20px 24px}h1{font-size:24px}p{color:#cbbca7;line-height:1.7}a{color:#ffbc7a}button,select{font:inherit;background:#49392d;color:#fff4e5;border:1px solid #896b51;border-radius:8px;padding:8px 14px;margin-right:12px}input{width:320px;vertical-align:middle}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px 24px}.pair img{width:100%}.pair p{margin:8px 0}body.large .pair{grid-template-columns:1fr}label{margin-right:20px}@media(max-width:900px){.pair{grid-template-columns:1fr}}</style><header><h1>网页与 Unity · 动效逐帧对照</h1><p>同一次选择操作，按毫秒暂停。左侧为原网页，右侧为 Unity 正式预制体。此处播放的是采样帧，不是网页模拟 Unity。</p><p><a href="parity.html">静态布局对照</a> · <a href="motion-evidence.json">时间与姿态记录</a></p><select id="case"><option value="index">左侧页签选中</option><option value="rank">排行榜选择钓友</option></select><button id="play">循环播放</button><button id="large">大图查看</button><label><input id="time" type="range" min="0" max="5" value="0"> <b id="ms">0ms</b></label></header><main class="pair"><div><p>原网页</p><img id="web"></div><div><p>Unity 实际渲染</p><img id="unity"></div></main><script>const cases=[{"id":"index","title":"左侧页签选中","page":"shop","times":[0,30,60,100,160,200]},{"id":"rank","title":"排行榜选择钓友","page":"rank","times":[0,60,110,180,220]}];let selected=cases[0],frame=0,timer;const slider=document.getElementById('time');function show(){frame=Math.min(frame,selected.times.length-1);slider.max=selected.times.length-1;slider.value=frame;const ms=selected.times[frame],base='motion-'+selected.id+'-'+String(ms).padStart(3,'0');document.getElementById('ms').textContent=ms+'ms';document.getElementById('web').src=base+'-web.webp';document.getElementById('unity').src=base+'.webp'}slider.oninput=()=>{frame=+slider.value;show()};document.getElementById('case').onchange=e=>{selected=cases.find(x=>x.id===e.target.value);frame=0;show()};document.getElementById('play').onclick=e=>{if(timer){clearInterval(timer);timer=null;e.target.textContent='循环播放'}else{timer=setInterval(()=>{frame=(frame+1)%selected.times.length;show()},350);e.target.textContent='暂停'}};document.getElementById('large').onclick=()=>document.body.classList.toggle('large');show();</script></html>
