const {records,groups,languages,states}=previewData;
const $=id=>document.getElementById(id);
let visible=[],selected=null;
for(const [value,title] of groups)$('group').add(new Option(title,value));
for(const [value,title] of Object.entries(states))$('state').add(new Option(title,value));
const labels=record=>(languages[record.language]||record.language)+' · '+(states[record.state]||record.state);
function show(record){
  if(!record)return;
  selected=record;
  $('preview').src=record.file;
  $('preview').alt=record.title+' · '+labels(record);
  $('caption').textContent=record.title;
  $('note').textContent=labels(record)+(record.group==='details'?' · 详情弹窗轮次截图；最新按钮见“按钮与间距”':'');
  $('original').href=record.file;
  document.querySelectorAll('.card').forEach(button=>button.setAttribute('aria-pressed',button.dataset.id===record.id));
  history.replaceState(null,'','#'+encodeURIComponent(record.id));
}
$('preview').addEventListener('load',()=>document.documentElement.style.setProperty('--image-width',$('preview').naturalWidth+'px'));
function filter(preferred){
  const group=$('group').value,language=$('language').value,state=$('state').value;
  visible=records.filter(record=>(group==='all'||record.group===group)&&(language==='all'||record.language===language||record.language==='shared')&&(state==='all'||record.state===state));
  $('gallery').replaceChildren(...visible.map(record=>{
    const button=document.createElement('button');button.className='card';button.dataset.id=record.id;button.setAttribute('aria-pressed','false');
    const image=document.createElement('img');image.src=record.file;image.alt=record.title;image.loading='lazy';image.width=288;image.height=180;
    const title=document.createElement('span');title.textContent=record.title;
    const subtitle=document.createElement('small');subtitle.textContent=labels(record);
    button.append(image,title,subtitle);button.onclick=()=>show(record);return button;
  }));
  $('status').textContent='共 '+records.length+' 张预览 · 当前显示 '+visible.length+' 张';
  $('empty').hidden=visible.length>0;
  document.querySelector('.viewer').hidden=visible.length===0;
  document.querySelector('.viewer-head').hidden=visible.length===0;
  $('previous').disabled=$('next').disabled=visible.length<2;
  show(visible.find(record=>record.id===(preferred||selected?.id))||visible[0]);
}
for(const id of ['group','language','state'])$(id).onchange=()=>filter();
$('reset').onclick=()=>{for(const id of ['group','language','state'])$(id).value='all';filter();};
function move(direction){if(!visible.length)return;show(visible[(visible.findIndex(record=>record.id===selected?.id)+direction+visible.length)%visible.length]);}
$('previous').onclick=()=>move(-1);$('next').onclick=()=>move(1);
$('fit').onclick=()=>{const original=document.body.classList.toggle('original');$('fit').textContent=original?'适应窗口':'原尺寸查看';$('fit').setAttribute('aria-pressed',original);};
document.addEventListener('keydown',event=>{if(/^(SELECT|INPUT|TEXTAREA|BUTTON)$/.test(event.target.tagName))return;if(event.key==='ArrowRight')move(1);if(event.key==='ArrowLeft')move(-1);});
const controlsOption=new Option('家园与 Overlay 交互按钮设计','../../../设计/界面/原型/家园与浮层按钮/index.html');$('reference').add(controlsOption,1);
$('reference').onchange=()=>{const src=$('reference').value;$('reference-frame').hidden=!src;if(src)$('reference-frame').src=src;else $('reference-frame').removeAttribute('src');};
$('home-controls').onclick=()=>{$('reference').value=controlsOption.value;$('reference').onchange();$('reference-frame').scrollIntoView({block:'start'});history.replaceState(null,'','#home-controls');};
function openHash(){
  if(location.hash==='#home-controls'){$('group').value='actions';$('language').value='zh-CN';filter();$('home-controls').click();return;}
  let initial='';try{initial=decodeURIComponent(location.hash.slice(1));}catch{}
  const record=records.find(record=>record.id===initial);
  $('group').value=record?.group||'actions';$('language').value=record?.language==='shared'?'all':record?.language||'zh-CN';$('state').value='all';
  filter(record?.id||'actions-PanelShop-zh-CN-default');
}
window.addEventListener('hashchange',openHash);
openHash();
</script>
</body>
</html>
