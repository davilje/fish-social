<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>岸边烤鱼 · 五只猫咪登录场景</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f0e8;color:#3f574d;font:15px/1.6 system-ui,"PingFang SC",sans-serif}main{max-width:1100px;padding:30px 24px;margin:auto}h1{margin:8px 0;font-size:28px}p{margin:6px 0 20px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button,a{font:inherit}button{background:#fffdf6;color:#3f574d;border:1px solid #bac7bc;border-radius:7px;padding:9px 15px;cursor:pointer}button[aria-pressed=true]{background:#3f6254;color:white}button:focus-visible{outline:3px solid #aa7840;outline-offset:3px}.stage{max-width:100%;width:960px;margin:auto;aspect-ratio:3/2;border-radius:12px;overflow:hidden;box-shadow:0 12px 32px #31463822}.stage img{width:100%;height:100%;object-fit:contain;display:block}.stage.actual{width:480px}.note{font-size:13px;color:#69796d;margin-top:16px}a{color:#3c6855}.refs{width:100%;margin-top:20px;border-radius:10px}</style><main><p><a href="../../../../../../art/login-pastel-2026-10-26/cats-v4/index.html">当前 v4：完整窗口与五猫透视修复 →</a> · 下方为旧版小卡片预览。</p><h1>岸边烤鱼 · 五只猫咪</h1><p>黑猫、奶牛猫、狸花猫「丧彪」、橘猫、三花猫，一起分享今天的烤鱼。</p><div class="bar"><button data-mode="unity" aria-pressed="true">Unity 实际效果</button><button data-mode="art" aria-pressed="false">纯场景</button><button data-mode="before" aria-pressed="false">加入猫咪前</button><button id="size" aria-pressed="false">实际尺寸 480 × 320</button></div><div class="stage"><img id="scene" src="unity-login-960x640.png" alt="五只猫咪围坐吃烤鱼的 Unity 登录界面"></div><p class="note" id="caption">Unity 编辑器实际渲染。静态背景，Logo、文案和登录按钮仍为独立 UI。</p><a href="login-background-cats-v3.png" target="_blank">查看场景原图 ↗</a> · <a href="generation-prompt.txt">生成提示词</a><img class="refs" src="cat-references.png" alt="五只项目猫咪的原始角色参考"></main><script>const files={unity:'unity-login-960x640.png',art:'login-background-cats-v3.png',before:'../login-background-v2.png'},captions={unity:'Unity 编辑器实际渲染。静态背景，Logo、文案和登录按钮仍为独立 UI。',art:'五只角色依项目形象重绘吃鱼姿势；背景继续沿用简化粉彩画风。',before:'上一版已采用的纯风景背景，供构图对照。'};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelector('#scene').src=files[b.dataset.mode];document.querySelector('#caption').textContent=captions[b.dataset.mode]});document.querySelector('#size').onclick=e=>{const on=document.querySelector('.stage').classList.toggle('actual');e.currentTarget.setAttribute('aria-pressed',on);e.currentTarget.textContent=on?'切回放大预览':'实际尺寸 480 × 320'};</script></html>
