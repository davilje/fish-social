name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build:shared

      - name: Unit tests
        run: npm test

      - name: Engineering + observability smoke
        run: |
          npm run verify:engineering
          npm run verify:server-observability
          npm run verify:auth
          npm run verify:data-platform-dp-a
          npm run verify:data-platform-dp-b
