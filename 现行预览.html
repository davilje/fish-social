<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fish Social · 现行预览</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --ink: #1c1917;
      --muted: #78716c;
      --card: #fffcf7;
      --line: #e7e0d5;
      --accent: #0e7490;
      --hero: #134e4a;
      --tab: #0f766e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.5 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .app { display: flex; height: 100%; }
    aside {
      width: 268px;
      flex: none;
      display: flex;
      flex-direction: column;
      background: var(--card);
      border-right: 1px solid var(--line);
    }
    aside header {
      background: var(--hero);
      color: #ecfdf5;
      padding: 1.15rem 1rem 1rem;
    }
    aside h1 { margin: 0; font-size: 1.2rem; font-weight: 700; }
    aside header p { margin: 0.45rem 0 0; font-size: 0.82rem; line-height: 1.45; opacity: 0.88; }
    nav { overflow: auto; padding: 0.35rem 0.65rem 1.2rem; }
    h2 {
      margin: 0.95rem 0.35rem 0.3rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    button {
      display: block;
      width: 100%;
      margin: 0 0 2px;
      padding: 0.48rem 0.7rem;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    button:hover { background: var(--bg); }
    button[aria-current="true"] { background: var(--tab); color: white; }
    button[aria-current="true"]:hover { background: var(--tab); }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
    main { flex: 1; min-width: 0; padding: 0.75rem; display: flex; }
    iframe {
      flex: 1;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
    }
    .gate {
      display: none;
      min-height: 100%;
      place-items: center;
      padding: 1.5rem;
    }
    body.is-file .app { display: none; }
    body.is-file .gate { display: grid; }
    .gate article {
      max-width: 32rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
    }
    .gate header { background: var(--hero); color: #ecfdf5; padding: 1.3rem 1.4rem; }
    .gate h1 { margin: 0; font-size: 1.35rem; }
    .gate div { padding: 1.15rem 1.4rem 1.35rem; }
    .gate p { margin: 0 0 0.7rem; }
    .gate strong { color: var(--accent); }
    @media (max-width: 700px) {
      .app { flex-direction: column; height: 100dvh; }
      aside { width: 100%; border-right: 0; border-bottom: 1px solid var(--line); }
      aside header { padding: 0.65rem 0.9rem; }
      aside h1 { font-size: 1rem; }
      aside header p { margin-top: 0.2rem; font-size: 0.73rem; }
      nav { display: flex; align-items: center; gap: 0.25rem; padding: 0.4rem 0.55rem; overflow-x: auto; }
      nav h2 { flex: none; margin: 0 0.4rem; white-space: nowrap; }
      nav button { width: auto; flex: none; margin: 0; white-space: nowrap; }
      main { min-height: 0; padding: 0.5rem; }
      iframe { min-height: 0; }
    }
  </style>
</head>
<body>
  <div class="gate">
    <article>
      <header><h1>现行预览</h1></header>
      <div>
        <p>这一页需要本地服务才能读到场景、音效和图片。直接双击 html 时，浏览器会拦住这些文件。</p>
        <p>请关闭本页，回到仓库根目录，双击 <strong>打开现行预览.bat</strong>。</p>
      </div>
    </article>
  </div>
  <div class="app">
    <aside>
      <header>
        <h1>现行预览</h1>
        <p>界面、形象、动作、地图、场景、特效和音效都在这一页。选择分类切换。演示数据，声音需要再点播放。</p>
      </header>
      <nav>
        <h2>手账</h2>
        <button type="button" data-src="docs/设计/界面/原型/手账/index.html?page=shop" aria-current="true">商店</button>
        <button type="button" data-src="docs/设计/界面/原型/手账/index.html?page=bag">背包</button>
        <button type="button" data-src="docs/设计/界面/原型/手账/index.html?page=equip">装备</button>
        <button type="button" data-src="docs/设计/界面/原型/手账/index.html?page=ach">成就</button>
        <button type="button" data-src="docs/设计/界面/原型/手账/index.html?page=rank">排行榜</button>
        <button type="button" data-src="docs/设计/界面/原型/手账/index.html?page=profile">个人信息</button>
        <button type="button" data-src="docs/设计/界面/原型/手账/index.html?page=feed">钓友动态</button>
        <button type="button" data-src="docs/设计/界面/原型/手账/index.html?page=settings">设置</button>
        <h2>家园与地图</h2>
        <button type="button" data-src="docs/设计/界面/原型/家园与浮层按钮/index.html#home" data-route="home-controls">家园交互按钮</button>
        <button type="button" data-src="docs/设计/界面/原型/家园与浮层按钮/index.html#overlay" data-route="overlay-controls">Overlay 按钮与打窝标记</button>
        <button type="button" data-src="docs/设计/界面/原型/手账/index.html?roomView=home">家园</button>
        <button type="button" data-src="docs/美术/家园/pastel-interior-2026-10-31/index.html?v=5-applied-static" data-route="home-interior">室内画风提案</button>
        <button type="button" data-src="docs/美术/场景/quiet-colors-2026-10-31/index.html?v=sparse-biomes-v1" data-route="world-map">世界地图</button>
        <button type="button" data-src="docs/设计/界面/原型/手账/index.html?page=ponds">选择鱼塘</button>
        <h2>资料与收获</h2>
        <button type="button" data-src="docs/设计/界面/原型/手账工作台/index.html#profile">个人资料</button>
        <button type="button" data-src="docs/设计/界面/原型/手账工作台/index.html#edit">编辑资料</button>
        <button type="button" data-src="docs/设计/界面/原型/手账工作台/index.html#compose">分享鱼获</button>
        <button type="button" data-src="docs/设计/界面/原型/手账工作台/index.html#settlement">离塘结算</button>
        <h2>钓友来信</h2>
        <button type="button" data-src="docs/设计/界面/原型/钓友来信/index.html#friends">我的钓友</button>
        <button type="button" data-src="docs/设计/界面/原型/钓友来信/index.html#requests">好友申请</button>
        <button type="button" data-src="docs/设计/界面/原型/钓友来信/index.html#dm">私信</button>
        <button type="button" data-src="docs/设计/界面/原型/钓友来信/index.html#pond">鱼塘聊天</button>
        <button type="button" data-src="docs/设计/界面/原型/钓友来信/index.html#notifications">消息通知</button>
        <h2>登录</h2>
        <button type="button" data-src="docs/美术/登录/cats-selected-2026-10-29/index.html?v=hue-saturation-v2" data-route="login">五猫完整窗口</button>
        <h2>形象</h2>
        <button type="button" data-src="docs/美术/猫咪形象/breeds.html">九种钓鱼猫咪</button>
        <button type="button" data-src="docs/美术/猫咪形象/sangbiao/index.html">狸花猫丧彪</button>
        <button type="button" data-src="docs/美术/猫咪形象/character-study-2026-10-24/index.html">六款形象稿</button>
        <h2>动作</h2>
        <button type="button" data-src="docs/美术/家园/interaction-study-2026-10-31/index.html" data-route="home-interaction">主界面猫咪交互 · 新提案</button>
        <button type="button" data-src="docs/美术/家园/rest-poses-2026-10-31/index.html" data-route="home-poses">猫咪睡姿与蹲姿 · 原画</button>
        <button type="button" data-src="docs/美术/钓鱼动作/index.html?clip=cast" data-route="fishing">塘内钓鱼动作</button>
        <button type="button" data-src="docs/美术/钓鱼动作/index.html?clip=fishing&amp;study=rest-v2" data-route="rest">呼吸与瞌睡</button>
        <button type="button" data-src="docs/设计/界面/原型/手账/home-animation-review.html">家园走路进食</button>
        <h2>场景</h2>
        <button type="button" data-src="docs/美术/场景/motion.html?v=21-restored-sky-clouds&amp;pond=pond-calm">场景图层预览</button>
        <h2>特效</h2>
        <button type="button" data-src="docs/美术/水面特效/index.html?style=magic">水面特效</button>
        <h2>音效</h2>
        <button type="button" data-src="docs/美术/声音/leaf-clusters/index.html?v=20261031-sunroom" data-route="audio">首页音乐与音效</button>
      </nav>
    </aside>
    <main>
      <iframe id="stage" title="现行预览"></iframe>
    </main>
  </div>
  <script>
    const stage = document.querySelector('#stage');
    const buttons = [...document.querySelectorAll('button[data-src]')];
    if (location.protocol === 'file:') {
      document.body.classList.add('is-file');
    } else {
      const savedSrc = sessionStorage.getItem('preview-src');
      const saved = buttons.find(button => button.dataset.src === savedSrc) ||
        (savedSrc === 'docs/设计/界面/原型/手账/index.html?page=map' || savedSrc?.startsWith('docs/美术/场景/quiet-colors-') ? buttons.find(button => button.dataset.route === 'world-map') : savedSrc?.startsWith('docs/美术/登录/') ? buttons.find(button => button.dataset.route === 'login') : savedSrc?.startsWith('docs/美术/声音/') ? buttons.find(button => button.dataset.route === 'audio') : savedSrc?.startsWith('docs/美术/钓鱼动作/') ? buttons.find(button => button.dataset.route === 'fishing') : savedSrc?.startsWith('docs/美术/家园/pastel-interior-2026-10-31/') ? buttons.find(button => button.dataset.route === 'home-interior') : null);
      const requestedPath = location.hash === '#scene' ? 'docs/美术/场景/motion.html' : location.hash === '#login' ? 'docs/美术/登录/cats-selected-2026-10-29/index.html' : location.hash === '#audio' ? 'docs/美术/声音/leaf-clusters/index.html' : null;
      const requested = buttons.find(button => button.dataset.route && '#'+button.dataset.route === location.hash) || (requestedPath ? buttons.find(button => button.dataset.src.startsWith(requestedPath)) : null);
      const current = requested || saved || buttons[0];
      buttons.forEach(button => {
        button.addEventListener('click', () => select(button));
      });
      select(current);
      window.addEventListener('hashchange', () => {
        const route = buttons.find(button => button.dataset.route && '#'+button.dataset.route===location.hash)?.dataset.route;
        const target = route ? buttons.find(button => button.dataset.route === route) :
          location.hash === '#scene' ? buttons.find(button => button.dataset.src.startsWith('docs/美术/场景/motion.html')) : null;
        if (target && stage.getAttribute('src') !== target.dataset.src) select(target);
      });
    }
    function select(button) {
      buttons.forEach(item => {
        if (item === button) item.setAttribute('aria-current', 'true');
        else item.removeAttribute('aria-current');
      });
      button.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      stage.src = button.dataset.src;
      const hash = button.dataset.route ? '#'+button.dataset.route : button.dataset.src.startsWith('docs/美术/场景/motion.html') ? '#scene' : '';
      history.replaceState(null, '', location.pathname + location.search + hash);
      sessionStorage.setItem('preview-src', button.dataset.src);
    }
  </script>
</body>
</html>
